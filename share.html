<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气象深高 - 定制分享</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="description" content="像《我的世界》一样搭建专属天气卡片，自由涂色、放置元素、插入数据变量。">
    <script>
      window.CDN_BASE = "https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809";
    </script>
    <style>
        :root {
            --grid-cell-size: 30px;
        }
        .builder-container {
            display: flex;
            height: calc(100vh - 50px);
            overflow: hidden;
        }
        .builder-sidebar {
            width: 280px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }
        .builder-workspace {
            flex: 1;
            background: #e0e5ec;
            position: relative;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px;
        }
        .grid-canvas {
            position: relative;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            image-rendering: pixelated;
        }
        .grid-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(16, var(--grid-cell-size));
            grid-template-rows: repeat(var(--grid-h, 16), var(--grid-cell-size));
        }
        .grid-cell {
            width: var(--grid-cell-size);
            height: var(--grid-cell-size);
            box-sizing: border-box;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .grid-cell:hover {
            border-color: rgba(0,123,255,0.6);
            z-index: 1;
        }
        .elements-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .placed-element {
            position: absolute;
            box-sizing: border-box;
            background: rgba(255,255,255,0.9);
            border: 2px dashed #666;
            padding: 4px;
            font-size: 13px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: grab;
            pointer-events: auto;
            z-index: 10;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.3;
        }
        .placed-element.selected {
            border-color: #007bff;
            border-style: solid;
            z-index: 20;
            box-shadow: 0 0 10px rgba(0,123,255,0.4);
        }
        .placed-element .var-tag {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
            font-size: 11px;
        }
        .tool-panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
        }
        .tool-panel h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #444;
            font-weight: 600;
        }
        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: transform 0.15s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.active {
            border-color: #333;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }
        .var-list button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 8px;
            margin-bottom: 4px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .var-list button:hover {
            background: #e9ecef;
        }
        .control-group {
            margin-bottom: 8px;
        }
        .control-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 3px;
            color: #666;
            font-weight: 500;
        }
        .control-group input[type="number"],
        .control-group input[type="text"],
        .control-group select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
        }
        .control-group input[type="color"] {
            width: 100%;
            height: 32px;
            padding: 2px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .mode-switch {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .mode-btn {
            flex: 1;
            min-width: 45px;
            padding: 6px 4px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-size: 11px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .mode-btn:hover {
            background: #f0f0f0;
        }
        .mode-btn.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        .action-btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
            transition: opacity 0.15s;
        }
        .action-btn.primary {
            background: #007bff;
            color: #fff;
        }
        .action-btn.secondary {
            background: #6c757d;
            color: #fff;
        }
        .action-btn.danger {
            background: #dc3545;
            color: #fff;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        
        /* 预览模态框 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .preview-modal.show {
            display: flex;
        }
        .preview-modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            max-width: 95%;
            max-height: 95%;
            overflow: auto;
            position: relative;
        }
        .preview-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .builder-container {
                flex-direction: column;
                height: auto;
            }
            .builder-sidebar {
                width: 100%;
                max-height: 400px;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
            .builder-workspace {
                min-height: 500px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航条 (与其他页面统一) -->
    <nav class="top-nav">
        <div class="nav-left">
            <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809/data/icons/logo.png" alt="Logo" class="nav-logo">
            <span class="nav-title">气象深高</span>
        </div>
        <div class="nav-right">
            <a href="/index.html" class="nav-link" title="返回主页">
                <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809/data/icons/home.svg" alt="主页" class="nav-icon">
            </a>
            <a href="/club.html" class="nav-link" title="社团介绍">
                <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809/data/icons/club.svg" alt="社团" class="nav-icon">
            </a>
            <a href="/links.html" class="nav-link" title="友情链接">
                <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809/data/icons/link.svg" alt="友链" class="nav-icon">
            </a>
            <a href="/10d.html" class="nav-link" title="十天预报">
                <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809/data/icons/10day.svg" alt="十天" class="nav-icon">
            </a>
        </div>
    </nav>

    <div class="builder-container">
        <!-- 左侧工具栏 -->
        <aside class="builder-sidebar">
            <div class="tool-panel">
                <h4>🛠️ 操作模式</h4>
                <div class="mode-switch">
                    <button class="mode-btn active" data-mode="paint">🎨 涂色</button>
                    <button class="mode-btn" data-mode="add-text">📝 文本</button>
                    <button class="mode-btn" data-mode="add-var">📊 数据</button>
                    <button class="mode-btn" data-mode="select">🖱️ 选择</button>
                </div>
            </div>

            <!-- 涂色工具 -->
            <div class="tool-panel" id="panel-paint">
                <h4>🎨 方块颜色</h4>
                <div class="color-palette" id="colorPalette"></div>
                <div class="control-group" style="margin-top:10px;">
                    <label>网格高度 (行数 4-128)</label>
                    <input type="number" id="gridHeightInput" value="16" min="4" max="128">
                </div>
                <button class="action-btn secondary" onclick="clearGrid()">🗑️ 清空画布</button>
            </div>

            <!-- 文本工具 -->
            <div class="tool-panel" id="panel-text" style="display:none;">
                <h4>📝 添加文本框</h4>
                <div class="control-group">
                    <label>内容 (支持 {变量})</label>
                    <textarea id="textContent" rows="3" placeholder="例如：当前温度 {realtime.temp}°C"></textarea>
                </div>
                <div class="control-group">
                    <label>字号 (px)</label>
                    <input type="number" id="textSize" value="14" min="8" max="48">
                </div>
                <div class="control-group">
                    <label>文字颜色</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
                <div class="control-group">
                    <label>尺寸 (格数)</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="textW" value="4" min="1" max="16" placeholder="宽">
                        <input type="number" id="textH" value="1" min="1" max="20" placeholder="高">
                    </div>
                </div>
                <button class="action-btn primary" onclick="confirmAddText()">✅ 放置文本</button>
            </div>

            <!-- 数据变量工具 -->
            <div class="tool-panel" id="panel-var" style="display:none;">
                <h4>📊 插入数据变量</h4>
                <p style="font-size:11px; color:#666; margin-bottom:8px;">点击变量将其放置在网格中心</p>
                
                <h5 style="font-size:12px; margin:8px 0 4px 0; color:#555;">实况数据</h5>
                <div class="var-list" id="varListRealtime"></div>
                
                <h5 style="font-size:12px; margin:10px 0 4px 0; color:#555;">预报数据 (相对日期)</h5>
                <div class="control-group">
                    <label>选择日期 (<span id="forecastDayLabel">今天</span>)</label>
                    <input type="range" id="forecastDayRange" min="0" max="9" value="0" oninput="updateForecastVars()">
                </div>
                <div class="var-list" id="varListForecast"></div>
            </div>

            <!-- 属性编辑 (选中元素时显示) -->
            <div class="tool-panel" id="panel-properties" style="display:none; border-left: 4px solid #007bff;">
                <h4>⚙️ 属性编辑</h4>
                <div id="propContent"></div>
                <button class="action-btn danger" onclick="deleteSelected()">🗑️ 删除元素</button>
            </div>

            <div style="margin-top:auto;">
                <button class="action-btn primary" onclick="generateShareLink()">🔗 生成分享链接</button>
                <button class="action-btn secondary" onclick="togglePreview()">👁️ 预览模式</button>
            </div>
            
            <div class="tool-panel" style="margin-top:10px; font-size:11px; color:#666;">
                <strong>💡 提示：</strong><br>
                1. 涂色模式：点击网格填色<br>
                2. 文本/数据模式：设置后点网格放置<br>
                3. 选择模式：拖动元素调整位置<br>
                4. 变量格式：<code>{realtime.temp}</code>
            </div>
        </aside>

        <!-- 工作区 -->
        <main class="builder-workspace">
            <div id="gridCanvas" class="grid-canvas" style="width: calc(16 * var(--grid-cell-size)); height: calc(16 * var(--grid-cell-size));">
                <div id="layer-bg" class="grid-bg-layer"></div>
                <div id="layer-elements" class="elements-layer"></div>
            </div>
        </main>
    </div>

    <!-- 预览模态框 -->
    <div id="previewModal" class="preview-modal">
        <div class="preview-modal-content">
            <button class="preview-close-btn" onclick="togglePreview()">&times;</button>
            <div id="previewContent"></div>
        </div>
    </div>

    <script src="script_share.js"></script>
</body>
</html>
