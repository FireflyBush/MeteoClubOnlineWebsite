<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>气象像素涂色板</title>
    <link rel="stylesheet" href="style_share.css">
    <!-- 兼容配置：如果以后要切回图片模式可以在这里配 CDN_BASE -->
    <script>window.CDN_BASE = 'https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0816';</script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-title">气象像素涂色板</div>
        <div class="nav-actions">
            <button id="modeToggleBtn" onclick="toggleEditMode()">👁️ 预览模式</button>
            <button class="primary" onclick="generateShareLink()">🔗 生成分享链接</button>
        </div>
    </nav>

    <div class="builder-container">
        <aside class="toolbar">
            <div class="tool-tabs">
                <button class="tab-btn active" data-tab="paint" onclick="switchTab('paint')">🎨 涂色</button>
                <button class="tab-btn" data-tab="data" onclick="switchTab('data')">📊 数据</button>
            </div>

            <div class="tool-content">
                <!-- 涂色面板 -->
                <div class="tool-panel active" id="panel-paint">
                    <h4>🎨 选择颜色</h4>
                    <div class="color-palette" id="colorPalette"></div>
                    
                    <div class="control-group drag-paint-toggle" style="margin-top:12px; display:flex; align-items:center; justify-content:space-between;">
                        <label style="margin-bottom:0; cursor:pointer;" for="dragPaintSwitch">🖌️ 拖拽涂色</label>
                        <label class="switch">
                            <input type="checkbox" id="dragPaintSwitch">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <p style="font-size:11px; color:#888; margin-top:4px; line-height:1.4;">
                        开启后可长按拖动连续涂色（手机端将锁定画布滑动）；关闭后可正常滑动挪动视角。
                    </p>

                    <div class="control-group" style="margin-top:10px;">
                        <label>网格高度 (行数 16-64)</label>
                        <input type="number" id="gridHeightInput" value="16" min="16" max="64">
                    </div>
                    <button class="action-btn secondary" onclick="clearGrid()">🗑️ 清空画布</button>
                </div>

                <!-- 数据面板 -->
                <div class="tool-panel" id="panel-data">
                    <h4>📊 放置数据</h4>
                    <div class="data-tools">
                        <button class="data-btn" onclick="setPendingBlock('rain')">🌧️ 降雨量</button>
                        <button class="data-btn" onclick="setPendingBlock('warning')">⚠️ 预警信号</button>
                        <button class="data-btn" onclick="setPendingBlock('text')">📝 文本</button>
                    </div>
                    <p style="font-size:11px; color:#888; margin-top:10px;">选择类型后，点击画布空白处放置。点击已放置的元素可编辑或删除。</p>
                </div>
            </div>

            <div class="author-input">
                <label>作者署名</label>
                <input type="text" id="authorName" placeholder="输入你的名字">
            </div>
        </aside>

        <main class="canvas-area">
            <div class="grid-canvas" id="gridCanvas">
                <div class="layer-bg" id="layer-bg"></div>
                <div class="layer-overlay" id="layer-overlay"></div>
            </div>
        </main>
    </div>

    <script src="test_share.js"></script>
    <script src="script_share.js"></script>
</body>
</html>
