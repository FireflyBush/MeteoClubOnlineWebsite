<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气象深高 - 我的天气栈</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_share.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="description" content="“我的天气栈”是“气象深高”网站的一个创意功能，网站用户可以进入并制作自己的天气实况和预报分享卡片。">
    <script>
      window.CDN_BASE = "https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0817";
    </script>
</head>
<body class="app-mode-preview">

    <!-- 顶部导航条 -->
    <nav class="top-nav">
        <div class="nav-left">
            <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0817/data/icons/logo.png" alt="Logo" class="nav-logo">
            <span class="nav-title">气象深高</span>
        </div>
        <div class="nav-right">
            <a href="/index.html" class="nav-link" title="返回主页">
                <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0817/data/icons/home.svg" alt="主页" class="nav-icon">
            </a>
        </div>
    </nav>

    <!-- 悬浮模式切换按钮 -->
    <button id="btn-enter-edit" class="float-btn" onclick="setAppMode('edit')">🛠️ 点我开始编辑</button>
    <button id="btn-exit-edit" class="float-btn" onclick="setAppMode('preview')" style="display:none;">📱️ 点我进入预览</button>

    <!-- 作者署名显示 -->
    <div id="authorDisplay" class="author-display"></div>

    <div class="builder-container">
        <!-- 左侧工具栏 -->
        <aside class="builder-sidebar">
            
            <!-- 合并面板：操作模式 + 分享提示 (Order 1) -->
            <div class="tool-panel panel-general" style="order: 1;">
                <h4>🛠️ 操作与分享</h4>
                
                <!-- 上部分：操作模式 -->
                <div class="mode-switch">
                    <button class="mode-btn" data-mode="palette">🎨 选色</button>
                    <button class="mode-btn" data-mode="add-text">📝 文本</button>
                    <button class="mode-btn active" data-mode="select">🖱️ 选择</button>
                </div>

                <!-- 分隔线 -->
                <div class="panel-divider"></div>

                <!-- 下部分：分享与设置 -->
                <div class="control-group">
                    <label>网格高度 (16-64)</label>
                    <input type="number" id="gridHeightInput" value="16" min="16" max="64">
                </div>
                
                <div class="control-group" style="margin-bottom: 10px;">
                    <label>作者署名</label>
                    <input type="text" id="authorName" placeholder="留下你的名字">
                </div>

                <button class="action-btn primary" onclick="generateShareLink()">🔗 生成分享链接</button>
                
                <div class="tips-area">
                    <strong>💡 创作提示：</strong><br>
                    1. 选色模式：用于绘制背景图样，选择一个颜色并打开涂色开关，点击画布即可填色。<br>
                    2. 文本模式：输入内容，或者点“🧩”插入变量添加可实时更新的气象数据，放置到网格中。<br>
                    3. 选择模式：拖动元素调整位置，并通过属性面板调节其内容和外观。
                </div>
            </div>

            <!-- 选色面板 (Order 2) -->
            <div class="tool-panel panel-palette" id="panel-paint" style="order: 2; display:none;">
                <h4>🎨 选择颜色</h4>
                <div class="color-palette" id="colorPalette"></div>
                
                <div class="control-group drag-paint-toggle" style="margin-top:12px; display:flex; align-items:center; justify-content:space-between;">
                    <label style="margin-bottom:0; cursor:pointer;" for="paintModeSwitch">🎨 涂色开关</label>
                    <label class="switch">
                        <input type="checkbox" id="paintModeSwitch">
                        <span class="slider"></span>
                    </label>
                </div>
                <p style="font-size:11px; color:#888; margin-top:4px; line-height:1.4;">
                    开启后可点击或拖动在网格上涂色（此时无法移动画布）；关闭后可正常拖动画布调整视野。
                </p>
                
                <button class="action-btn secondary" onclick="clearGrid()" style="margin-top:15px;">🗑️ 清空画布</button>
            </div>

            <!-- 文本面板 (Order 3) -->
            <div class="tool-panel panel-text" id="panel-text" style="order: 3; display:none;">
                <h4>📝 添加文本/板块</h4>
                
                <div class="control-group">
                    <label>文字颜色</label>
                    <div class="color-palette-mini" id="textColorPalette"></div>
                </div>

                <div class="control-group" style="position: relative;">
                    <label>内容 (支持变量)</label>
                    <div style="position: relative;">
                        <textarea id="textContent" rows="3" placeholder="例如：今日天气："></textarea>
                        
                        <!-- 变量与板块按钮组 -->
                        <div class="input-action-btns">
                            <button type="button" class="insert-var-btn" onclick="toggleVarMenu()" title="插入变量">🧩</button>
                            <!-- 新增：板块按钮 -->
                            <button type="button" class="insert-var-btn" onclick="placeSpecialBlock('warning')" title="添加预警信息">⚠️</button>
                            <button type="button" class="insert-var-btn" onclick="placeSpecialBlock('rain')" title="添加降雨预报">🌧️</button>
                        </div>
                        
                        <div id="varMenu" class="var-menu" style="display: none;">
                            <div class="var-section-title">实况数据</div>
                            <div class="var-list-mini" id="varMenuRealtime"></div>
                            
                            <div class="var-section-title" style="margin-top:10px;">
                                预报数据 
                                <select id="varMenuDaySelect" style="width: auto; font-size: 11px; padding: 2px; margin-left: 5px;" onchange="updateVarMenuForecast()">
                                    <option value="0">+1天</option>
                                    <option value="1">+2天</option>
                                    <option value="2">+3天</option>
                                </select>
                            </div>
                            <div class="var-list-mini" id="varMenuForecast"></div>
                        </div>
                    </div>
                </div>

                <div class="control-group" style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label>字号</label>
                        <input type="number" id="textSize" value="35" min="8" max="72">
                    </div>
                    <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:2px;">
                        <label>粗体</label>
                        <label class="switch">
                            <input type="checkbox" id="textBold">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="control-group">
                    <label>对齐方式</label>
                    <select id="textAlign">
                        <option value="left">左对齐</option>
                        <option value="center" selected>居中</option>
                        <option value="right">右对齐</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>尺寸 (格数)</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="textW" value="6" min="1" max="16" placeholder="宽">
                        <input type="number" id="textH" value="2" min="1" max="20" placeholder="高">
                    </div>
                </div>
                <button class="action-btn primary" onclick="confirmAddText()">✅ 放置文本</button>
            </div>
            
            <!-- 属性面板 (Order 4) -->
            <div class="tool-panel panel-properties" id="panel-properties" style="order: 4; display:none; border-left: 4px solid #007bff;">
                <h4>⚙️ 属性编辑</h4>
                <div id="propContent"></div>
                <button class="action-btn danger" onclick="deleteSelected()">🗑️ 删除元素</button>
            </div>

        </aside>

        <!-- 工作区 -->
        <main class="builder-workspace">
            <div id="gridCanvas" class="grid-canvas view-only">
                <div id="layer-bg" class="grid-bg-layer"></div>
                <div id="layer-elements" class="elements-layer"></div>
            </div>
        </main>
    </div>

    <!-- 引入依赖 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="script_share.js"></script>
</body>
</html>
