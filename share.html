<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气象深高 - 定制分享</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_share.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="description" content="像《我的世界》一样搭建专属天气卡片，自由涂色、放置元素、插入数据变量。">
    <script>
      window.CDN_BASE = "https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809";
    </script>
</head>
<body class="app-mode-preview">

    <!-- 顶部导航条 -->
    <nav class="top-nav">
        <div class="nav-left">
            <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809/data/icons/logo.png" alt="Logo" class="nav-logo">
            <span class="nav-title">气象深高</span>
        </div>
        <div class="nav-right">
            <a href="/index.html" class="nav-link" title="返回主页">
                <img src="https://cdn.jsdelivr.net/gh/FireflyBush/MeteoClubOnlineWebsite@2026.0809/data/icons/home.svg" alt="主页" class="nav-icon">
            </a>
        </div>
    </nav>

    <!-- 悬浮模式切换按钮 -->
    <button id="btn-enter-edit" class="float-btn" onclick="setAppMode('edit')">🛠️ 进入编辑模式</button>
    <button id="btn-exit-edit" class="float-btn" onclick="setAppMode('preview')" style="display:none;">👁️ 退出编辑预览</button>

    <div class="builder-container">
        <!-- 左侧工具栏 -->
        <aside class="builder-sidebar">
            <div class="tool-panel">
                <h4>🛠️ 操作模式</h4>
                <div class="mode-switch">
                    <button class="mode-btn active" data-mode="paint">🎨 涂色</button>
                    <button class="mode-btn" data-mode="add-text">📝 文本</button>
                    <button class="mode-btn" data-mode="add-var">📊 变量</button>
                    <button class="mode-btn" data-mode="add-block">📦 板块</button>
                    <button class="mode-btn" data-mode="select">🖱️ 选择</button>
                </div>
            </div>

            <div class="tool-panel" id="panel-paint">
                <h4>🎨 方块颜色</h4>
                <div class="color-palette" id="colorPalette"></div>
                <div class="control-group" style="margin-top:10px;">
                    <label>网格高度 (行数 16-64)</label>
                    <input type="number" id="gridHeightInput" value="16" min="16" max="64">
                </div>
                <button class="action-btn secondary" onclick="clearGrid()">🗑️ 清空画布</button>
            </div>

            <div class="tool-panel" id="panel-text" style="display:none;">
                <h4>📝 添加文本框</h4>
                <div class="control-group">
                    <label>内容 (支持 {变量})</label>
                    <textarea id="textContent" rows="3" placeholder="例如：当前温度 {realtime.temp}°C"></textarea>
                </div>
                <div class="control-group">
                    <label>字号</label>
                    <input type="number" id="textSize" value="14" min="8" max="48">
                </div>
                <div class="control-group">
                    <label>文字颜色</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
                <div class="control-group">
                    <label>尺寸 (格数)</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="textW" value="4" min="1" max="16" placeholder="宽">
                        <input type="number" id="textH" value="1" min="1" max="20" placeholder="高">
                    </div>
                </div>
                <button class="action-btn primary" onclick="confirmAddText()">✅ 放置文本</button>
            </div>

            <div class="tool-panel" id="panel-var" style="display:none;">
                <h4>📊 插入数据变量</h4>
                <p style="font-size:11px; color:#666; margin-bottom:8px;">点击变量将其放置在网格中心</p>
                
                <h5 style="font-size:12px; margin:8px 0 4px 0; color:#555;">实况数据</h5>
                <div class="var-list" id="varListRealtime"></div>
                
                <h5 style="font-size:12px; margin:10px 0 4px 0; color:#555;">预报数据 (相对日期)</h5>
                <div class="control-group">
                    <label>选择日期 (<span id="forecastDayLabel">今天</span>)</label>
                    <input type="range" id="forecastDayRange" min="0" max="9" value="0" oninput="updateForecastVars()">
                </div>
                <div class="var-list" id="varListForecast"></div>

                <h5 style="font-size:12px; margin:10px 0 4px 0; color:#555;">数据板块</h5>
                <div class="var-list" id="varListBlock"></div>
            </div>

            <div class="tool-panel" id="panel-properties" style="display:none; border-left: 4px solid #007bff;">
                <h4>⚙️ 属性编辑</h4>
                <div id="propContent"></div>
                <button class="action-btn danger" onclick="deleteSelected()">🗑️ 删除元素</button>
            </div>

            <div style="margin-top:auto;">
                <button class="action-btn primary" onclick="generateShareLink()">🔗 生成分享链接</button>
            </div>
            
            <div class="tool-panel" style="margin-top:10px; font-size:11px; color:#666;">
                <strong>💡 提示：</strong><br>
                1. 涂色模式：点击网格填色<br>
                2. 文本/数据模式：设置后点网格放置<br>
                3. 选择模式：拖动元素调整位置<br>
                4. 变量格式：<code>{realtime.temp}</code>
            </div>
        </aside>

        <!-- 工作区 -->
        <main class="builder-workspace">
            <div id="gridCanvas" class="grid-canvas view-only">
                <div id="layer-bg" class="grid-bg-layer"></div>
                <div id="layer-elements" class="elements-layer"></div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <!-- 引入依赖 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="script_share.js"></script>
</body>
</html>
